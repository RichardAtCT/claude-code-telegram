name: Feature request
description: Propose a change or an addition
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, check the [v2 roadmap](https://github.com/RichardAtCT/claude-code-telegram/blob/main/docs/ROADMAP-v2.md) and the open pull requests. If it is already planned, comment on that item instead so effort is not duplicated.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do from Telegram and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What the bot should do. If it involves a command or button, sketch the interaction.
      placeholder: |
        You: /sessions
        Bot: [Yesterday: fix auth bug] [Mon: add tests] ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other ways this could be solved.
  - type: dropdown
    id: scope
    attributes:
      label: Which part of the bot does this touch?
      multiple: true
      options:
        - Agentic chat (orchestrator)
        - Claude SDK integration
        - Security / permissions
        - Sessions and storage
        - Webhooks, scheduler, notifications
        - Project threads
        - Voice, images, files
        - Deployment and configuration
        - Documentation
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this
